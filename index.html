<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon. Drop the PNG(s) into public/ (Vite copies them to the site root). -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>BEACON — Byrne Evaluation And Comparison Of Nations</title>
    <meta name="description" content="Greatest country on earth? You decide. Weight six pillars of national performance — health, development, freedom, power, safety, and governance — and watch the rankings update." />
    <link rel="canonical" href="https://beacon.byrnecreative.com/" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BEACON" />
    <meta property="og:title" content="BEACON — Byrne Evaluation And Comparison Of Nations" />
    <meta property="og:description" content="Greatest country on earth? You decide. Weight six pillars of national performance and watch the rankings update." />
    <meta property="og:url" content="https://beacon.byrnecreative.com/" />
    <meta property="og:image" content="https://beacon.byrnecreative.com/sharing-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BEACON — rank the world's countries by the values you choose." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BEACON — Byrne Evaluation And Comparison Of Nations" />
    <meta name="twitter:description" content="Greatest country on earth? You decide. Weight six pillars of national performance and watch the rankings update." />
    <meta name="twitter:image" content="https://beacon.byrnecreative.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="BEACON — rank the world's countries by the values you choose." />

    <!-- Warm up the Typekit connection before the kit CSS / font files are requested.
         Two preconnects: one crossorigin (for the font files, fetched in CORS mode),
         one plain (for the stylesheet, fetched without CORS). -->
    <link id="tk-preconnect" rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link id="tk-preconnect-css" rel="preconnect" href="https://use.typekit.net" />

    <!-- Start the primary Requiem face downloading during HTML parse.
         crossorigin is required even though the file is same-origin: fonts are always
         fetched in CORS mode, so the preload must match the @font-face request. -->
    <link id="tk-preload-requiem" rel="preload" as="font" type="font/woff2"
          href="/fonts/RequiemText-HTF-Roman.woff2" crossorigin />

    <!-- Hypatia Sans Pro (Adobe Fonts / Typekit kit) -->
    <link id="tk-hypatia" rel="stylesheet" href="https://use.typekit.net/jqp6jnv.css" />

    <!-- Minimal reset so the coral header reaches the edges and the paper bg fills overscroll -->
    <style>html,body,#root{margin:0;min-height:100%;background:#FAFBFC;-webkit-font-smoothing:antialiased;}</style>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NTBSNCRW99"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NTBSNCRW99');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
